name: brew test-bot
on:
  push:
    branches:
      - main
  pull_request:
env:
  HOMEBREW_NO_INSTALL_FROM_API: 1
jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        id: test-bot-formulae
        if: github.event_name == 'pull_request'

      # test-bot ignores build, linkage and test failures on platforms where a
      # formula was never bottled, so fail explicitly if anything was skipped.
      - name: Check all formulae were bottled
        if: github.event_name == 'pull_request' && steps.test-bot-formulae.outputs.skipped_or_failed_formulae != ''
        env:
          SKIPPED_OR_FAILED: ${{ steps.test-bot-formulae.outputs.skipped_or_failed_formulae }}
        run: |
          echo "::error::Skipped or failed formulae: $SKIPPED_OR_FAILED"
          exit 1

      # Linux bottles share the x86_64_linux tag, so only publish them from
      # one Ubuntu runner to avoid conflicting bottles in pr-pull.
      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request' && matrix.os != 'ubuntu-26.04'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
